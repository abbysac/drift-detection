name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ---------------------------------------------------------
      # 3. Configure AWS credentials
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      # ---------------------------------------------------------
      # 4. Verify AWS authentication
      # ---------------------------------------------------------
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ---------------------------------------------------------
      # 5. Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init

      # ---------------------------------------------------------
      # 6. Terraform Plan / Drift Detection
      #
      # Exit codes:
      #   0 = No changes
      #   1 = Terraform error
      #   2 = Drift / changes detected
      # ---------------------------------------------------------
      - name: Terraform Drift Check
        id: plan
        working-directory: ./terraform
        continue-on-error: true
        shell: bash
        run: |
          set +e

          terraform plan \
            -detailed-exitcode \
            -no-color \
            > drift-plan.txt 2>&1

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "TERRAFORM PLAN"
          echo "=========================================="

          cat drift-plan.txt

          echo "=========================================="
          echo "Terraform exit code: $EXIT_CODE"
          echo "=========================================="

          # Exit 0 here so the workflow can continue
          # to the SES notification step.
          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

          exit 0

      # ---------------------------------------------------------
      # 7. Display the saved drift plan
      # ---------------------------------------------------------
      - name: Show drift plan file
        if: steps.plan.outputs.exit_code == '2'
        run: |
          echo "=========================================="
          echo "DRIFT DETECTED"
          echo "=========================================="

          echo ""
          echo "Full Terraform plan:"
          cat terraform/drift-plan.txt

      # ---------------------------------------------------------
      # 8. Create SES email request
      # ---------------------------------------------------------
      - name: Prepare SES email
        if: steps.plan.outputs.exit_code == '2'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          plan_file = Path("terraform/drift-plan.txt")

          if not plan_file.exists():
              raise SystemExit("ERROR: terraform/drift-plan.txt was not found")

          plan = plan_file.read_text()

          body = f"""Terraform Drift Detected

          Terraform detected changes in your AWS infrastructure.

          Terraform Plan
          ===============

          {plan}

          ===============

          Review the changes above and determine whether they were intentional.
          """

          request = {
              "Source": os.environ["SES_FROM"],
              "Destination": {
                  "ToAddresses": [
                      os.environ["SES_TO"]
                  ]
              },
              "Message": {
                  "Subject": {
                      "Data": "Terraform Drift Detected",
                      "Charset": "UTF-8"
                  },
                  "Body": {
                      "Text": {
                          "Data": body,
                          "Charset": "UTF-8"
                      }
                  }
              }
          }

          Path("/tmp/ses-request.json").write_text(
              json.dumps(request, indent=2)
          )

          print("SES request created successfully.")
          print("Plan size:", len(plan), "characters")
          PY

      # ---------------------------------------------------------
      # 9. Send SES notification
      # ---------------------------------------------------------
      - name: Send SES drift notification
        if: steps.plan.outputs.exit_code == '2'
        run: |
          echo "=========================================="
          echo "SENDING SES DRIFT NOTIFICATION"
          echo "=========================================="

          aws ses send-email \
            --region us-east-1 \
            --cli-input-json file:///tmp/ses-request.json

          echo "=========================================="
          echo "SES EMAIL SENT"
          echo "=========================================="

      # ---------------------------------------------------------
      # 10. Report no drift
      # ---------------------------------------------------------
      - name: No drift detected
        if: steps.plan.outputs.exit_code == '0'
        run: |
          echo "=========================================="
          echo "NO DRIFT DETECTED"
          echo "=========================================="
          echo "Terraform infrastructure matches configuration."

      # ---------------------------------------------------------
      # 11. Report Terraform error
      # ---------------------------------------------------------
      - name: Terraform plan failed
        if: steps.plan.outputs.exit_code == '1'
        run: |
          echo "=========================================="
          echo "TERRAFORM PLAN FAILED"
          echo "=========================================="

          echo "Terraform encountered an error."
          echo ""
          echo "Plan output:"
          cat terraform/drift-plan.txt

          exit 1