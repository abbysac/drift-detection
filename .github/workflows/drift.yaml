name: Terraform Drift Detection

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * *"  # daily at 2 AM UTC
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Detect Drift)
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -out=tfplan -input=false
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: No Drift Detected
        if: steps.plan.outputs.exitcode == '0'
        run: echo "✅ No infrastructure drift detected."

      - name: Drift Detected
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "⚠️ Infrastructure drift detected."
          terraform show -no-color tfplan
          exit 1

      - name: Plan Failed
        if: steps.plan.outputs.exitcode == '1'
        run: |
          echo "❌ Terraform plan failed to execute."
          exit 1
