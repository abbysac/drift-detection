name: Terraform Drift Detection

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * *"  # daily at 2 AM UTC

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')
      
          # Decode the JWT payload (2nd segment) without verifying signature
          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)
          # pad base64 if needed
          MOD=$((${#PAYLOAD} % 4))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
      
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, workflow, event_name}'
