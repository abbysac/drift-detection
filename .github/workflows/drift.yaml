name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Test AWS credentials
        run: aws sts get-caller-identity
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

    
      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        continue-on-error: true
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -no-color > drift-plan.txt 2>&1

          EXIT_CODE=$?

          echo "Terraform exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          cat drift-plan.txt

          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

          exit 0

      - name: Check drift result
        run: |
          echo "Terraform plan exit code: '${{ steps.plan.outputs.exit_code }}'"

      - name: Check drift report
        if: steps.plan.outputs.exit_code == '2'
        run: |
          echo "Drift detected!"
          echo "Checking drift report..."

          ls -lah terraform/

          if [ ! -f terraform/drift-plan.txt ]; then
            echo "ERROR: drift-plan.txt does not exist!"
            exit 1
          fi

          echo "drift-plan.txt exists."
          echo "File size:"
          wc -c terraform/drift-plan.txt

      - name: Test SES
        if: steps.plan.outputs.exit_code == '2'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          echo "======================================"
          echo "TESTING SES"
          echo "======================================"

          echo "Sender: $SES_FROM"
          echo "Recipient: $SES_TO"

          echo "Testing AWS identity..."

          aws sts get-caller-identity

          echo "Testing SES..."

          aws ses get-account-sending-enabled \
            --region us-east-1

          echo "Sending test email..."

          aws ses send-email \
            --region us-east-1 \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --subject "Terraform Drift Test" \
            --text "Terraform detected drift. This is a test email."

          echo "======================================"
          echo "SES TEST COMPLETED"
          echo "======================================"

      - name: Send detailed drift email
        if: steps.plan.outputs.exit_code == '2'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          echo "Sending detailed Terraform drift email..."

          python3 <<'PY'
          import json

          with open("terraform/drift-plan.txt", "r") as f:
              plan = f.read()

          body = f"""Terraform Drift Detected

          AWS infrastructure differs from the Terraform configuration.

          Terraform detected the following changes:

          ========================================

          {plan}

          ========================================

          GitHub Actions Run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please review the changes before applying Terraform.
          """

          message = {
              "Subject": {
                  "Data": "Terraform Drift Detected"
              },
              "Body": {
                  "Text": {
                      "Data": body
                  }
              }
          }

          with open("/tmp/ses-message.json", "w") as f:
              json.dump(message, f)

          print("SES JSON created.")
          PY

          cat /tmp/ses-message.json

          aws ses send-email \
            --region us-east-1 \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --message file:///tmp/ses-message.json

          echo "Detailed SES email sent."

      - name: Fail if drift detected
        if: steps.plan.outputs.exit_code == '2'
        run: |
          echo "Terraform drift detected!"
          exit 2