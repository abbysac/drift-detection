name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Test AWS credentials
        run: aws sts get-caller-identity
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

    
      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        continue-on-error: true
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -no-color > drift-plan.txt 2>&1

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Show the plan in the GitHub Actions log
          cat drift-plan.txt

          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

          exit 0

      - name: Upload Terraform drift report
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-report
          path: terraform/drift-plan.txt

      - name: Send drift email
        if: steps.plan.outputs.exit_code == '2'
        env:
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          PLAN=$(cat terraform/drift-plan.txt)

          python3 - "$PLAN" <<'PY' > /tmp/email.json
          import json
          import sys

          plan = sys.argv[1]

          message = {
              "Subject": {
                  "Data": "Terraform Drift Detected"
              },
              "Body": {
                  "Text": {
                      "Data": (
                          "Terraform has detected drift in your AWS infrastructure.\n\n"
                          "The following resources have changes:\n\n"
                          "========================================\n"
                          + plan +
                          "\n========================================\n\n"
                          "Review these changes and determine whether they were intentional."
                      )
                  }
              }
          }

          print(json.dumps(message))
          PY

          aws ses send-email \
            --region "us-east-1" \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --message file:///tmp/email.json