name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::224761220970:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Test AWS credentials
        run: aws sts get-caller-identity
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

    
      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        continue-on-error: true
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -no-color > drift-plan.txt 2>&1

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Show the plan in the GitHub Actions log
          cat drift-plan.txt

          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

          exit 0

      - name: Upload Terraform drift report
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-drift-report
          path: terraform/drift-plan.txt

      - name: Verify SES configuration
        if: steps.plan.outputs.exit_code == '2'
        env:
         SES_FROM: "abbysac@gmail.com"
         SES_TO: "camleous@yahoo.com"
        run: |
          echo "SES region: us-east-1"
          echo "SES sender: $SES_FROM"
          echo "SES recipient: $SES_TO"

          echo "Checking SES identity..."

          aws ses get-identity-verification-attributes \
            --region us-east-1 \
            --identities "$SES_FROM" "$SES_TO"

      - name: Send drift email
        if: steps.plan.outputs.exit_code == '2'
        env:
         SES_FROM: "abbysac@gmail.com"
         SES_TO: "camleous@yahoo.com"
        run: |
          echo "Preparing Terraform drift email..."

          if [ ! -f terraform/drift-plan.txt ]; then
            echo "ERROR: drift-plan.txt was not found!"
            exit 1
          fi

          echo "Drift report found:"
          ls -lh terraform/drift-plan.txt

          python3 <<'PY'
          import json

          with open("terraform/drift-plan.txt", "r") as f:
              plan = f.read()

          body = (
              "Terraform Drift Detected\n\n"
              "AWS infrastructure differs from the Terraform configuration.\n\n"
              "The following Terraform plan shows the detected changes:\n\n"
              "==================================================\n\n"
              + plan +
              "\n\n==================================================\n\n"
              "Please review these changes and determine whether they were intentional.\n\n"
              "GitHub Actions run:\n"
              "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n"
          )

          message = {
              "Subject": {
                  "Data": "Terraform Drift Detected"
              },
              "Body": {
                  "Text": {
                      "Data": body
                  }
              }
          }

          with open("/tmp/ses-message.json", "w") as f:
              json.dump(message, f)

          print("SES message created successfully.")
          print("Email body length:", len(body))
          PY

          echo "Sending email through Amazon SES..."

          aws ses send-email \
            --region us-east-1 \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --message file:///tmp/ses-message.json

          echo "✅ SES email sent successfully."