name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours
  workflow_dispatch:

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Test AWS credentials
        run: aws sts get-caller-identity
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ./terraform
        continue-on-error: true
        shell: bash
        run: |
          set +e

          terraform plan -detailed-exitcode -out=tfplan

          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 1 ]; then
            exit 1
          fi

          exit 0

      - name: Send drift email
        if: steps.plan.outputs.exitcode == '2'
        env:
          AWS_REGION: us-east-1
          SES_FROM: "abbysac@gmail.com"
          SES_TO: "camleous@yahoo.com"
        run: |
          aws ses send-email \
            --region "us-east-1" \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --message '{
              "Subject": {
                "Data": "Terraform Drift Detected"
              },
              "Body": {
                "Text": {
                  "Data": "Terraform has detected drift in your AWS infrastructure.\n\nReview the Terraform plan and determine whether the changes were intentional."
                }
              }
            }'

      - name: Fail if drift detected
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "Terraform drift detected!"
          exit 2
