name: Terraform Drift Detection

on:
  schedule:
    - cron: "0 */6 * * *"   # Run every 6 hours
  workflow_dispatch:

jobs:
  drift-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: terraform plan -detailed-exitcode -out=tfplan

      - name: Send drift email
        if: steps.plan.outputs.exitcode == '2'
        env:
          AWS_REGION: us-east-1
          SES_FROM: ${{ abbysac@gmail.com }}
          SES_TO: ${{ camleous@yahoo.com }}
        run: |
          aws ses send-email \
            --region "us-east-1" \
            --from "$SES_FROM" \
            --destination "ToAddresses=$SES_TO" \
            --message '{
              "Subject": {
                "Data": "Terraform Drift Detected"
              },
              "Body": {
                "Text": {
                  "Data": "Terraform has detected drift in your AWS infrastructure.\n\nReview the Terraform plan and determine whether the changes were intentional."
                }
              }
            }'

      - name: Fail if drift detected
        if: steps.plan.outputs.exitcode == '2'
        run: |
          echo "Terraform drift detected!"
          exit 2
